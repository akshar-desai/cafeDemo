<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BucksSauce Landing Page Reveal | Codegrid</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Instrument+Sans:wght@500&display=swap"
  />

  <link rel="preload" as="image" href="/public/logo.webp" type="image/webp" />
  <link rel="preload" as="image" href="/public/item6.webp" type="image/webp" />

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div class="preloader">
    <div class="preloader-bg"></div>
    <div class="preloader-revealer preloader-revealer-1"></div>
    <div class="preloader-revealer preloader-revealer-2"></div>
    <div class="preloader-revealer preloader-revealer-3"></div>
    <div class="preloader-revealer preloader-revealer-4"></div>

    <div class="items">
      <div class="item item-1"><img src="/public/item1.webp" width="600" height="600" decoding="async" alt="" /></div>
      <div class="item item-2"><img src="/public/item2.webp" width="600" height="600" decoding="async" alt="" /></div>
      <div class="item item-3"><img src="/public/item3.webp" width="600" height="600" decoding="async" alt="" /></div>
      <div class="item item-4"><img src="/public/item4.webp" width="600" height="600" decoding="async" alt="" /></div>
    </div>

    <div class="preloader-logo"><img src="/public/logo.webp" decoding="async" fetchpriority="high" alt="" /></div>
  </div>

  <nav>
    <div class="nav-logo">
      <img src="/public/logo.webp" decoding="async" alt="" />
    </div>
    <div class="nav-items">
      <!-- <a href="#">Menu</a>
      <a href="#">Locations</a>
      <a href="#">Our Story</a>
      <a href="#">Reserve</a>
      <a href="#">FAQ</a>
      <a href="#">Order</a> -->
    </div>
  </nav>

  <section class="hero">
    <div class="hero-header">
      <h1>The table you will keep coming back to every week</h1>
    </div>

    <div class="hero-img">
      <div class="hero-img-bg"></div>
      <img src="/public/item6.webp" decoding="async" fetchpriority="high" alt="" />
    </div>

 
  </section>

  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script defer src="/script.js"></script>
</body>
</html>
